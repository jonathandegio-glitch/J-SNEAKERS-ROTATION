<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>J Sneaker Rotation</title>
<style>
:root {
--bg-color: #0b0f19;
--card-color: #151c2c;
--card-hover: #1e283d;
--border-color: #2a364f;
--text-main: #f8fafc;
--text-muted: #94a3b8;
--accent-color: #ef4444;
--accent-orange: #f97316;
--accent-volt: #10b981;
--panel-bg: #111827;
--accent-blue: #3b82f6;
--radius-lg: 18px;
--radius-md: 12px;
--radius-sm: 8px;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
background-color: var(--bg-color);
color: var(--text-main);
padding: 16px;
padding-bottom: 90px;
overflow-x: hidden;
}

/* LOGIN OVERLAY */
#loginOverlay {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
background: var(--bg-color);
z-index: 9999999;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}

.login-card {
background: var(--panel-bg);
border: 1px solid var(--border-color);
border-radius: var(--radius-lg);
padding: 28px 24px;
width: 100%;
max-width: 360px;
box-shadow: 0 10px 30px rgba(0,0,0,0.8);
text-align: center;
}

.login-card img {
height: 80px;
width: auto;
margin-bottom: 16px;
}

.login-card h2 {
font-size: 18px;
margin-bottom: 20px;
color: var(--text-main);
font-weight: 800;
}

.login-error {
color: var(--accent-color);
font-size: 12px;
margin-top: 10px;
display: none;
font-weight: 700;
}

.container {
max-width: 800px;
margin: 0 auto;
}

header {
position: sticky;
top: 0;
z-index: 50;
display: grid;
grid-template-columns: 1fr auto 1fr;
align-items: center;
padding: 12px 16px;
background: var(--panel-bg);
border: 1px solid var(--border-color);
border-radius: var(--radius-lg);
margin-bottom: 20px;
box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.header-left {
display: flex;
align-items: center;
justify-content: flex-start;
}

.header-center {
display: flex;
justify-content: center;
align-items: center;
cursor: pointer;
user-select: none;
}

.header-logo-img {
height: 115px;
width: auto;
max-width: 260px;
object-fit: contain;
display: block;
}

.header-right {
display: flex;
justify-content: flex-end;
align-items: center;
z-index: 60;
}

.sync-status-badge {
font-size: 9px;
padding: 4px 8px;
border-radius: 20px;
font-weight: 700;
text-transform: uppercase;
background: rgba(255,255,255,0.05);
border: 1px solid var(--border-color);
color: var(--text-muted);
}

.menu-btn {
background: var(--card-color);
border: 1px solid var(--border-color);
color: var(--text-main);
padding: 12px 16px;
border-radius: var(--radius-md);
font-weight: 700;
font-size: 14px;
cursor: pointer;
display: flex;
align-items: center;
gap: 6px;
box-shadow: 0 2px 8px rgba(0,0,0,0.3);
-webkit-tap-highlight-color: transparent;
}

.menu-btn:active {
background: var(--accent-blue);
border-color: var(--accent-blue);
}

/* MENU DRAWER */
.drawer {
position: fixed;
top: 0;
right: -320px;
width: 300px;
height: 100%;
background: var(--panel-bg);
border-left: 1px solid var(--border-color);
z-index: 99999;
padding: 24px 20px;
transition: right 0.3s ease-in-out;
box-shadow: -10px 0 30px rgba(0,0,0,0.9);
display: flex;
flex-direction: column;
gap: 16px;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}

.drawer.open {
right: 0;
}

.drawer-header {
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid var(--border-color);
padding-bottom: 12px;
}

.drawer-header h3 {
font-size: 16px;
color: var(--accent-blue);
font-weight: 800;
}

.close-btn {
background: none;
border: none;
color: var(--text-muted);
font-size: 24px;
cursor: pointer;
padding: 4px;
}

button.btn {
background: var(--accent-blue);
color: #fff;
border: none;
padding: 12px 18px;
border-radius: var(--radius-md);
font-weight: 700;
font-size: 13px;
cursor: pointer;
display: inline-flex;
align-items: center;
justify-content: center;
gap: 8px;
width: 100%;
box-shadow: 0 2px 10px rgba(59, 130, 246, 0.2);
-webkit-tap-highlight-color: transparent;
}

button.btn-secondary {
background: var(--card-color);
color: var(--text-main);
border: 1px solid var(--border-color);
box-shadow: none;
}

button.btn-danger {
background: var(--accent-color);
color: #fff;
}

.stats-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 10px;
margin-bottom: 20px;
}

.stat-card {
background: var(--card-color);
border: 1px solid var(--border-color);
border-radius: var(--radius-md);
padding: 12px;
}

.stat-card h4 {
font-size: 10px;
color: var(--text-muted);
text-transform: uppercase;
margin-bottom: 4px;
}

.stat-card p {
font-size: 20px;
font-weight: 800;
}

.main-layout {
display: flex;
flex-direction: column;
gap: 20px;
}

details.panel-accordion {
background: var(--panel-bg);
border: 1px solid var(--border-color);
border-radius: var(--radius-lg);
overflow: hidden;
}

details.panel-accordion summary {
padding: 16px;
font-size: 13px;
font-weight: 800;
text-transform: uppercase;
cursor: pointer;
list-style: none;
display: flex;
justify-content: space-between;
align-items: center;
user-select: none;
background: rgba(255,255,255,0.02);
}

details.panel-accordion summary::-webkit-details-marker { display: none; }

details.panel-accordion summary::after {
content: '▼';
font-size: 10px;
color: var(--text-muted);
transition: transform 0.2s;
}

details.panel-accordion[open] summary::after {
transform: rotate(180deg);
}

details.panel-accordion summary .badge-count {
font-size: 11px;
background: rgba(255,255,255,0.08);
padding: 3px 10px;
border-radius: 12px;
color: var(--text-muted);
margin-left: auto;
margin-right: 8px;
}

.panel-content {
padding: 16px;
border-top: 1px solid var(--border-color);
}

details.subcat-accordion {
margin-bottom: 12px;
background: rgba(0,0,0,0.15);
border: 1px solid rgba(255,255,255,0.05);
border-radius: var(--radius-md);
}

details.subcat-accordion summary {
font-size: 11px;
font-weight: 800;
text-transform: uppercase;
color: var(--accent-orange);
padding: 10px 12px;
cursor: pointer;
display: flex;
justify-content: space-between;
align-items: center;
list-style: none;
}

details.subcat-accordion summary::-webkit-details-marker { display: none; }

details.subcat-accordion summary::after {
content: '►';
font-size: 9px;
transition: transform 0.2s;
}

details.subcat-accordion[open] summary::after {
transform: rotate(90deg);
}

.subcat-content { padding: 10px; }

.shoe-item {
background: var(--card-color);
border: 1px solid var(--border-color);
border-radius: var(--radius-md);
padding: 12px;
margin-bottom: 10px;
display: flex;
justify-content: space-between;
align-items: center;
gap: 8px;
}

.shoe-info { flex-grow: 1; min-width: 0; }

.shoe-name-text {
font-weight: 700;
font-size: 13px;
color: var(--text-main);
margin-bottom: 4px;
word-break: break-word;
}

.shoe-meta {
font-size: 10px;
color: var(--text-muted);
display: flex;
gap: 6px;
align-items: center;
flex-wrap: wrap;
}

.code-badge {
font-family: monospace;
background: rgba(255,255,255,0.06);
padding: 2px 5px;
border-radius: var(--radius-sm);
color: var(--accent-blue);
font-weight: 700;
}

.percent-badge {
font-family: monospace;
background: rgba(255,255,255,0.06);
padding: 2px 5px;
border-radius: var(--radius-sm);
color: var(--accent-orange);
font-weight: 700;
}

.percent-badge.completed {
color: var(--accent-volt);
background: rgba(16, 185, 129, 0.15);
border: 1px solid rgba(16, 185, 129, 0.3);
}

.usage-badge-container {
display: flex;
align-items: center;
gap: 6px;
flex-shrink: 0;
}

.counter-btn {
width: 32px;
height: 32px;
border-radius: 50%;
border: 1px solid var(--border-color);
background: var(--panel-bg);
color: #fff;
font-weight: 800;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 16px;
-webkit-tap-highlight-color: transparent;
}

.counter-btn:active { background: var(--accent-blue); }
.counter-btn.minus:active { background: var(--accent-color); }

.usage-counter {
font-family: monospace;
font-size: 13px;
font-weight: 800;
min-width: 24px;
text-align: center;
}

.delete-icon {
color: var(--text-muted);
cursor: pointer;
padding: 4px;
font-size: 13px;
}

.field-group {
display: flex;
flex-direction: column;
gap: 6px;
margin-bottom: 12px;
}

.field-group label {
font-size: 11px;
font-weight: 700;
color: var(--text-muted);
text-transform: uppercase;
}

.field-group input, .field-group select, .field-group textarea {
background: var(--bg-color);
border: 1px solid var(--border-color);
border-radius: var(--radius-md);
padding: 10px;
color: #fff;
font-size: 13px;
width: 100%;
outline: none;
}

.modal-overlay {
position: fixed;
top: 0; left: 0; width: 100vw; height: 100vh;
background: rgba(0,0,0,0.8);
display: none;
justify-content: center;
align-items: center;
z-index: 999999;
padding: 16px;
}

.modal-box {
background: var(--panel-bg);
border: 1px solid var(--border-color);
border-radius: var(--radius-lg);
padding: 20px;
max-width: 500px;
width: 100%;
max-height: 90vh;
overflow-y: auto;
}

.log-item {
background: var(--card-color);
border-left: 3px solid var(--accent-blue);
padding: 10px;
border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
margin-bottom: 8px;
font-size: 12px;
display: flex;
justify-content: space-between;
align-items: center;
gap: 8px;
}

.log-date { font-size: 10px; color: var(--text-muted); white-space: nowrap; }

.trash-item {
background: var(--card-color);
border: 1px solid var(--border-color);
border-radius: var(--radius-md);
padding: 8px 10px;
font-size: 12px;
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 6px;
gap: 8px;
}
</style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay">
<div class="login-card">
<img src="https://lh3.googleusercontent.com/d/18hKMBI-uLfVQY7TGoaiHsHG-AER88n0l=s800" alt="Logo">
<h2>Accesso Riservato</h2>
<div class="field-group" style="text-align:left;">
<label>Nome Utente</label>

<div style="font-size:11px; color:var(--text-muted);">Cestino vuoto.</div>
</div>

<hr style="border-color: var(--border-color); margin: 4px 0;">

</div>

<!-- Modal Aggiungi Scarpa -->
<div id="shoeModal" class="modal-overlay">

</div>
</div>

<!-- Modal JSON -->
<div id="jsonModal" class="modal-overlay">
<div class="modal-box">
<div style="font-size: 16px; font-weight: 800; margin-bottom: 14px;">Importa Backup JSON</div>

<textarea id="mJsonText" rows="6" placeholder="Incolla il codice JSON qui..."></textarea>
</div>
<div style="display:flex; gap:10px; justify-content:flex-end;">
<button id="closeJsonModalBtn" class="btn btn-secondary">Chiudi</button>
<button id="processJsonBtn" class="btn">Importa</button>
</div>
</div>
</div>

<div class="container">
<header>
<div class="header-left">
<span id="syncStatus" class="sync-status-badge">PRONTO</span>
</div>
<div id="headerCenter" class="header-center">
<img src="https://lh3.googleusercontent.com/d/18hKMBI-uLfVQY7TGoaiHsHG-AER88n0l=s800" alt="Logo" class="header-logo-img">
</div>
<div class="header-right">

</header>

<div class="stats-grid">

</div>

</div>

<div class="main-layout">

<span>02 // COLLEZIONE</span>

</summary>

</details>

<summary><span>ULTIMI MOVIMENTI</span></summary>

<script>
const FIREBASE_URL = "https://j-sneaker-rotation-default-rtdb.europe-west1.firebasedatabase.app/";

const AUTH_USER = "JDEGIO28";
const AUTH_PASS = "Laborracaldafaschiuma2739@";

let shoes = [];
let logs = [];
let trash = [];
const currentYear = new Date().getFullYear();

function checkAuth() {
if (sessionStorage.getItem('j_sneaker_auth') === 'true') {
document.getElementById('loginOverlay').style.display = 'none';
initApp();
} else {
document.getElementById('loginOverlay').style.display = 'flex';
}
}

function handleLogin() {
const userIn = document.getElementById('loginUser').value.trim();
const passIn = document.getElementById('loginPass').value.trim();
const errEl = document.getElementById('loginError');

if (userIn === AUTH_USER && passIn === AUTH_PASS) {
sessionStorage.setItem('j_sneaker_auth', 'true');
document.getElementById('loginOverlay').style.display = 'none';
errEl.style.display = 'none';
initApp();
} else {
errEl.style.display = 'block';
}
}

function handleLogout() {
sessionStorage.removeItem('j_sneaker_auth');
location.reload();
}

function generateUniqueCode() {
return 'SK-' + Math.random().toString(36).substring(2, 6).toUpperCase();
}

document.addEventListener('DOMContentLoaded', () => {
document.getElementById('loginBtn').addEventListener('click', handleLogin);
document.getElementById('loginPass').addEventListener('keypress', (e) => {
if (e.key === 'Enter') handleLogin();
});
document.getElementById('loginUser').addEventListener('keypress', (e) => {
if (e.key === 'Enter') handleLogin();
});
checkAuth();
});

function initApp() {
loadConfig();
loadLocalData();
updateSubGroupOptions();
renderAll();
initEventListeners();
loadFromFirebase();
}

function initEventListeners() {
const closeDrawerBtn = document.getElementById('closeDrawerBtn');
if (closeDrawerBtn) closeDrawerBtn.addEventListener('click', toggleDrawer);

const logoutBtn = document.getElementById('logoutBtn');
if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);

const headerCenter = document.getElementById('headerCenter');
if (headerCenter) headerCenter.addEventListener('click', () => window.scrollTo({top: 0, behavior: 'smooth'}));

const appsScriptUrl = document.getElementById('appsScriptUrl');
if (appsScriptUrl) appsScriptUrl.addEventListener('change', saveConfig);

const importSheetBtn = document.getElementById('importSheetBtn');
if (importSheetBtn) importSheetBtn.addEventListener('click', importFromSheetUrl);

const addShoeBtn = document.getElementById('addShoeBtn');
if (addShoeBtn) addShoeBtn.addEventListener('click', openAddShoeModal);

const importLocalBtn = document.getElementById('importLocalBtn');
if (importLocalBtn) importLocalBtn.addEventListener('click', openImportLocalModal);

const emergencyBtn = document.getElementById('emergencyBtn');
if (emergencyBtn) emergencyBtn.addEventListener('click', openImportEmergencyModal);

const exportJsonBtn = document.getElementById('exportJsonBtn');
if (exportJsonBtn) exportJsonBtn.addEventListener('click', exportBackupJSON);

const undoBtn = document.getElementById('undoBtn');
if (undoBtn) undoBtn.addEventListener('click', undoLastLog);

const mShoeMacro = document.getElementById('mShoeMacro');
if (mShoeMacro) mShoeMacro.addEventListener('change', updateSubGroupOptions);

const closeShoeModalBtn = document.getElementById('closeShoeModalBtn');
if (closeShoeModalBtn) closeShoeModalBtn.addEventListener('click', closeShoeModal);

const saveShoeBtn = document.getElementById('saveShoeBtn');
if (saveShoeBtn) saveShoeBtn.addEventListener('click', saveShoeFromModal);

const closeJsonModalBtn = document.getElementById('closeJsonModalBtn');
if (closeJsonModalBtn) closeJsonModalBtn.addEventListener('click', closeJsonModal);

const processJsonBtn = document.getElementById('processJsonBtn');
if (processJsonBtn) processJsonBtn.addEventListener('click', processJsonImport);
}

function toggleDrawer() {
const drawer = document.getElementById('drawerMenu');
if (drawer) {
drawer.classList.toggle('open');
}
}

function saveConfig() {
const url = document.getElementById('appsScriptUrl').value.trim();
localStorage.setItem('j_sneaker_script_url', url);
updateStatus("CONFIG SALVATA");
}

function loadConfig() {
const url = localStorage.getItem('j_sneaker_script_url') || '';
const el = document.getElementById('appsScriptUrl');
if (el) el.value = url;
}

function updateStatus(msg) {
const badge = document.getElementById('syncStatus');
if (badge) badge.innerText = msg;
}

function saveLocalData() {
localStorage.setItem('j_sneaker_shoes_v10', JSON.stringify(shoes));
localStorage.setItem('j_sneaker_logs_v10', JSON.stringify(logs));
localStorage.setItem('j_sneaker_trash_v10', JSON.stringify(trash));
}

function loadLocalData() {
const localShoes = localStorage.getItem('j_sneaker_shoes_v10');
const localLogs = localStorage.getItem('j_sneaker_logs_v10');
const localTrash = localStorage.getItem('j_sneaker_trash_v10');
if (localShoes) shoes = JSON.parse(localShoes);
if (localLogs) logs = JSON.parse(localLogs);
if (localTrash) trash = JSON.parse(localTrash);
}

function getYearUsages(shoeCode) {
return logs.filter(l => l.shoeCode === shoeCode && l.date.includes('/' + currentYear)).length;
}

async function loadFromFirebase() {
updateStatus("SYNC...");
try {
const response = await fetch(FIREBASE_URL + "data.json");
if (response.ok) {
const data = await response.json();
if (data) {
if (data.shoes) shoes = data.shoes;
if (data.logs) logs = data.logs;
if (data.trash) trash = data.trash;
saveLocalData();
renderAll();
}
updateStatus("ONLINE");
} else {
updateStatus("ERR SYNC");
}
} catch(e) {
updateStatus("ERR SYNC");
}
}

async function syncToServer() {
updateStatus("SYNC...");
const payload = {
shoes: shoes,
logs: logs,
trash: trash
};

// Sincronizzazione con Google Apps Script (se inserito l'URL)
const scriptUrl = localStorage.getItem('j_sneaker_script_url');
if (scriptUrl) {
try {
fetch(scriptUrl, {
method: "POST",
mode: "no-cors",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ action: "SYNC_ALL", shoes: shoes, logs: logs })
});
} catch(e) {}
}

// Sincronizzazione principale su Firebase Realtime Database
try {
const response = await fetch(FIREBASE_URL + "data.json", {
method: "PUT",
headers: { "Content-Type": "application/json" },
body: JSON.stringify(payload)
});
if (response.ok) {
updateStatus("ONLINE");
} else {
updateStatus("ERR SYNC");
}
} catch(e) {
updateStatus("ERR SYNC");
}
}

function updateSubGroupOptions() {
const macro = document.getElementById('mShoeMacro').value;
const subSelect = document.getElementById('mShoeSub');
if (!subSelect) return;
subSelect.innerHTML = '';
if (macro === 'collezione') {
subSelect.innerHTML = '<option value="yeezy">Adidas & Yeezy</option><option value="jordanike">Jordan & Nike</option><option value="altro">Altro Collezione</option>';
} else {
subSelect.innerHTML = '<option value="lavoro">Lavoro / Quotidiano</option><option value="palestra">Palestra / Sport</option><option value="outdoor">Outdoor / Stivali</option><option value="casual">Casual / Libero</option><option value="misto">Misto</option><option value="sport">Sport</option><option value="uscite">Uscite</option>';
}
}

window.editGoal = function(code) {
const shoe = shoes.find(s => s.code === code);
if (!shoe) return;
const newGoal = prompt("Nuovo obiettivo utilizzi per " + shoe.name, shoe.goal);
if (newGoal !== null && !isNaN(newGoal) && newGoal.trim() !== "") {
shoe.goal = parseInt(newGoal, 10);
saveLocalData();
renderAll();
syncToServer();
}
};

window.recordUsage = function(code) {
const shoe = shoes.find(s => s.code === code);
if (!shoe) return;
shoe.usages += 1;
shoe.lastUsed = new Date().toLocaleDateString('it-IT');
const nowStr = new Date().toLocaleDateString('it-IT') + " " + new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
logs.unshift({ date: nowStr, shoeCode: shoe.code, shoeName: shoe.name, macro: shoe.macro });
if (logs.length > 50) logs.pop();
saveLocalData();
renderAll();
syncToServer();
};

window.decreaseUsage = function(code) {
const shoe = shoes.find(s => s.code === code);
if (!shoe || shoe.usages <= 0) return;
shoe.usages -= 1;
const logIdx = logs.findIndex(l => l.shoeCode === shoe.code);
if (logIdx !== -1) logs.splice(logIdx, 1);
saveLocalData();
renderAll();
syncToServer();
};

function undoLastLog() {
if (logs.length === 0) { alert("Nessun movimento recente."); return; }
const last = logs.shift();
const shoe = shoes.find(s => s.code === last.shoeCode);
if (shoe && shoe.usages > 0) shoe.usages -= 1;
saveLocalData();
renderAll();
syncToServer();
alert("Ultimo movimento annullato!");
}

window.deleteShoe = function(code) {
const shoe = shoes.find(s => s.code === code);
if (!shoe) return;
if (confirm("Spostare '" + shoe.name + "' nel cestino?")) {
trash.push(shoe);
shoes = shoes.filter(s => s.code !== code);
saveLocalData();
renderAll();
syncToServer();
}
};

window.restoreShoe = function(code) {
const shoe = trash.find(s => s.code === code);
if (!shoe) return;
shoes.push(shoe);
trash = trash.filter(s => s.code !== code);
saveLocalData();
renderAll();
syncToServer();
}

function renderAll() {
updateStats();
renderLists();
renderTrash();
}

function updateStats() {
document.getElementById('stat-comune').innerText = shoes.filter(s => s.macro === 'uso comune').length;
document.getElementById('stat-collezione').innerText = shoes.filter(s => s.macro === 'collezione').length;
let yearTotal = 0;
shoes.forEach(s => { yearTotal += getYearUsages(s.code); });
document.getElementById('stat-year').innerText = yearTotal;
let completed = shoes.filter(s => s.goal > 0 && s.usages >= s.goal).length;
document.getElementById('stat-completed').innerText = completed;
document.getElementById('count-comune').innerText = shoes.filter(s => s.macro === 'uso comune').length + " PAIA";
document.getElementById('count-collezione').innerText = shoes.filter(s => s.macro === 'collezione').length + " PAIA";
}

function buildShoeCard(shoe) {
const yearUsages = getYearUsages(shoe.code);
const goal = shoe.goal || 1;
const pct = Math.round((shoe.usages / goal) * 100);
const isCompleted = pct >= 100;
const pctClass = isCompleted ? "percent-badge completed" : "percent-badge";

return `<div class="shoe-item">
<div class="shoe-info">
<div class="shoe-name-text">${shoe.name}</div>
<div class="shoe-meta">
<span class="code-badge">${shoe.code}</span>
<span>Anno: <b>${yearUsages}</b></span>
<span onclick="editGoal('${shoe.code}')" style="cursor:pointer; text-decoration:underline;">Obiettivo: <b>${shoe.goal}</b></span>
<span class="${pctClass}">${pct}%</span>
</div>
</div>
<div class="usage-badge-container">
<button class="counter-btn minus" onclick="decreaseUsage('${shoe.code}')">-</button>
<span class="usage-counter">${shoe.usages}</span>
<button class="counter-btn" onclick="recordUsage('${shoe.code}')">+</button>
<span class="delete-icon" onclick="deleteShoe('${shoe.code}')">🗑️</span>
</div>
</div>`;
}

function renderLists() {
const listComune = document.getElementById('list-comune');
const listCollezione = document.getElementById('list-collezione');
const logList = document.getElementById('log-list');
if(!listComune || !listCollezione || !logList) return;

listComune.innerHTML = '';
listCollezione.innerHTML = '';
logList.innerHTML = '';

let collYeezy = '', collJordanike = '', collAltro = '';
let subComuneMap = {};

shoes.forEach(s => {
const card = buildShoeCard(s);
if (s.macro === 'collezione') {
if (s.sub === 'yeezy') collYeezy += card;
else if (s.sub === 'jordanike') collJordanike += card;
else collAltro += card;
} else {
let subKey = (s.sub || 'casual').toLowerCase().trim();
if (!subComuneMap[subKey]) subComuneMap[subKey] = '';
subComuneMap[subKey] += card;
}
});

let comuneHtml = '';
let defaultSubComune = ['lavoro', 'palestra', 'outdoor', 'casual', 'misto', 'sport', 'uscite'];
defaultSubComune.forEach(sub => {
if (subComuneMap[sub]) {
comuneHtml += `<details class="subcat-accordion" open><summary>// ${sub.toUpperCase()}</summary><div class="subcat-content">${subComuneMap[sub]}</div></details>`;
delete subComuneMap[sub];
}
});
for (let sub in subComuneMap) {
comuneHtml += `<details class="subcat-accordion" open><summary>// ${sub.toUpperCase()}</summary><div class="subcat-content">${subComuneMap[sub]}</div></details>`;
}
listComune.innerHTML = comuneHtml || '<div style="font-size:11px; color:var(--text-muted);">Nessun modello.</div>';

listCollezione.innerHTML = `<details class="subcat-accordion" open><summary>// ADIDAS & YEEZY</summary><div class="subcat-content">${collYeezy || '<div style="font-size:11px; color:var(--text-muted);">Nessuna.</div>'}</div></details>
<details class="subcat-accordion" open><summary>// JORDAN & NIKE</summary><div class="subcat-content">${collJordanike || '<div style="font-size:11px; color:var(--text-muted);">Nessuna.</div>'}</div></details>
<details class="subcat-accordion" open><summary>// ALTRO COLLEZIONE</summary><div class="subcat-content">${collAltro || '<div style="font-size:11px; color:var(--text-muted);">Nessuna.</div>'}</div></details>`;

if (logs.length === 0) {
logList.innerHTML = '<div style="font-size:12px; color:var(--text-muted);">Nessun movimento recente.</div>';
} else {
logs.slice(0, 15).forEach(l => {
logList.innerHTML += `<div class="log-item"><div><b>${l.shoeName}</b></div><div class="log-date">${l.date}</div></div>`;
});
}
}

function renderTrash() {
const trashList = document.getElementById('trash-list');
if(!trashList) return;
trashList.innerHTML = '';
if (trash.length === 0) { trashList.innerHTML = '<div style="font-size:11px; color:var(--text-muted);">Cestino vuoto.</div>'; return; }
trash.forEach(s => {
trashList.innerHTML += `<div class="trash-item"><div><b>${s.name}</b></div><button class="btn btn-secondary" style="padding:4px 8px; font-size:10px;" onclick="restoreShoe('${s.code}')">Ripristina</button></div>`;
});
}

function openAddShoeModal() { document.getElementById('shoeModal').style.display = 'flex'; }
function closeShoeModal() { document.getElementById('shoeModal').style.display = 'none'; }
function saveShoeFromModal() {
const name = document.getElementById('mShoeName').value.trim();
const goal = parseInt(document.getElementById('mShoeGoal').value, 10) || 30;
const macro = document.getElementById('mShoeMacro').value;
const sub = document.getElementById('mShoeSub').value;
if (!name) { alert("Inserisci un nome."); return; }
shoes.push({ code: generateUniqueCode(), name: name, goal: goal, usages: 0, macro: macro, sub: sub, lastUsed: null });
saveLocalData(); renderAll(); syncToServer(); closeShoeModal(); toggleDrawer();
}

function importFromSheetUrl() {
const urlInput = document.getElementById('importSheetUrl');
const url = urlInput.value.trim();
const match = url.match(/\/d\/([a-zA-Z0-9-_]+)\//);
if (!match) { alert("URL Google Fogli non valido."); return; }
updateStatus("IMPORT...");
let oldScript = document.getElementById('gvizImportScript');
if (oldScript) oldScript.remove();
let script = document.createElement('script');
script.id = 'gvizImportScript';
script.src = "https://docs.google.com/spreadsheets/d/" + match[1] + "/gviz/tq?headers=0&tqx=responseHandler:handleSheetImport";
document.body.appendChild(script);
urlInput.value = '';
}

window.handleSheetImport = function(response) {
if (response && response.status === 'ok') {
shoes = [];
response.table.rows.forEach((row) => {
if (row && row.c) {
let getVal = (idx) => (!row.c[idx] || row.c[idx].v === null) ? '' : String(row.c[idx].f || row.c[idx].v || '').trim();
let name = getVal(0);
if (!name || name.toLowerCase() === 'nome') return;
let goal = parseInt(getVal(1), 10) || 30;
let macroRaw = getVal(2).toLowerCase();
let subRaw = getVal(3).toLowerCase();

let macro = macroRaw.includes('collezione') ? 'collezione' : 'uso comune';
let sub = subRaw ? subRaw : 'casual';

shoes.push({ code: generateUniqueCode(), name: name, goal: goal, usages: 0, macro: macro, sub: sub, lastUsed: null });
}
});
saveLocalData(); renderAll(); syncToServer();
alert("Importate " + shoes.length + " scarpe correttamente!");
toggleDrawer();
}
};

function openImportLocalModal() { document.getElementById('jsonModal').style.display = 'flex'; }
function closeJsonModal() { document.getElementById('jsonModal').style.display = 'none'; }
function processJsonImport() {
try {
const data = JSON.parse(document.getElementById('mJsonText').value.trim());
if (data && data.state) {
for (let name in data.state) {
let ex = shoes.find(s => s.name.toLowerCase() === name.toLowerCase());
if (ex) ex.usages = data.state[name].usages;
else shoes.push({ code: generateUniqueCode(), name: name, goal: 30, usages: data.state[name].usages, macro: 'uso comune', sub: 'casual' });
}
saveLocalData(); renderAll(); syncToServer(); closeJsonModal(); toggleDrawer(); alert("Importato!");
}
} catch(e) { alert("JSON non valido."); }
}

function exportBackupJSON() {
let exp = { state: {}, history: logs };
shoes.forEach(s => { exp.state[s.name] = { usages: s.usages }; });
navigator.clipboard.writeText(JSON.stringify(exp, null, 2)).then(() => alert("Copiato negli appunti!"));
}

async function openImportEmergencyModal() {
const url = localStorage.getItem('j_sneaker_script_url');
if (!url) { alert("Manca URL script."); return; }
try {
const res = await fetch(url + "?action=GET_ALL");
const data = await res.json();
if (data && data.shoes) { shoes = data.shoes; logs = data.logs || []; saveLocalData(); renderAll(); toggleDrawer(); alert("Ripristinato!"); }
} catch(e) { alert("Errore recupero."); }
}
</script>
