<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>J Sneaker Rotation</title>
<style>
:root {
--bg-color: #0b0f19;
--card-color: #151c2c;
--card-hover: #1e283d;
--border-color: #2a364f;
--text-main: #f8fafc;
--text-muted: #94a3b8;
--accent-color: #ef4444;
--accent-orange: #f97316;
--accent-volt: #10b981;
--panel-bg: #111827;
--accent-blue: #3b82f6;
--radius-lg: 18px;
--radius-md: 12px;
--radius-sm: 8px;
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
body {
background-color: var(--bg-color);
color: var(--text-main);
padding: 16px;
padding-bottom: 90px;
overflow-x: hidden;
}
/* LOGIN OVERLAY */
#loginOverlay {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
background: var(--bg-color);
z-index: 9999999;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}
.login-card {
background: var(--panel-bg);
border: 1px solid var(--border-color);
border-radius: var(--radius-lg);
padding: 28px 24px;
width: 100%;
max-width: 360px;
box-shadow: 0 10px 30px rgba(0,0,0,0.8);
text-align: center;
}
.login-card img {
height: 80px;
width: auto;
margin-bottom: 16px;
}
.login-card h2 {
font-size: 18px;
margin-bottom: 20px;
color: var(--text-main);
font-weight: 800;
}
.login-error {
color: var(--accent-color);
font-size: 12px;
margin-top: 10px;
display: none;
font-weight: 700;
}
.container {
max-width: 800px;
margin: 0 auto;
}
header {
position: sticky;
top: 0;
z-index: 50;
display: grid;
grid-template-columns: 1fr auto 1fr;
align-items: center;
padding: 12px 16px;
background: var(--panel-bg);
border: 1px solid var(--border-color);
border-radius: var(--radius-lg);
margin-bottom: 20px;
box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.header-left {
display: flex;
align-items: center;
justify-content: flex-start;
}
.header-center {
display: flex;
justify-content: center;
align-items: center;
cursor: pointer;
user-select: none;
}
.header-logo-img {
height: 130px;
width: auto;
max-width: 260px;
object-fit: contain;
display: block;
}
.header-right {
display: flex;
justify-content: flex-end;
align-items: center;
z-index: 60;
}
.sync-status-badge {
font-size: 9px;
padding: 4px 8px;
border-radius: 20px;
font-weight: 700;
text-transform: uppercase;
background: rgba(255,255,255,0.05);
border: 1px solid var(--border-color);
color: var(--text-muted);
}
.menu-btn {
background: var(--card-color);
border: 1px solid var(--border-color);
color: var(--text-main);
padding: 12px 16px;
border-radius: var(--radius-md);
font-weight: 700;
font-size: 14px;
cursor: pointer;
display: flex;
align-items: center;
gap: 6px;
